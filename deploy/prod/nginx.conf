server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Docker's embedded DNS. Static hostnames in proxy_pass are resolved only
    # once when nginx starts, so recreating an app container left nginx talking
    # to a stale IP and every /api/ request returned 502. A variable hostname
    # makes nginx resolve on request (cached for `valid`), so a recreated
    # city-api or frontend is picked up within ~10s without a gateway restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Compose service names (not container names) so this one config works in
    # both the production project (`prod`) and the isolated local/dev project.
    set $api_backend "city-api:8000";
    set $frontend_backend "frontend:3000";

    location = /health {
        proxy_pass http://$api_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Strip the public /api prefix before proxying to the FastAPI app.
        # Only the hostname is a variable: with no URI part in proxy_pass,
        # nginx forwards the current (rewritten) request URI itself, which
        # preserves the original URI encoding and query-string behaviour.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /world/ {
        # No rewrite here: the original request URI is forwarded unchanged.
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
