services:
  city-api:
    build:
      context: ../../backend
    container_name: ai3k-city-api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/ai3k
      JWT_SECRET: ${JWT_SECRET}
      CITY_NAME: ${CITY_NAME}
      CITY_BASE_URL: ${CITY_BASE_URL}
      CITY_LOCATION: ${CITY_LOCATION}
      WORLD_NAME: ${WORLD_NAME}
      CITY_WALL: ${CITY_WALL}
      CITY_TAX_RATE: ${CITY_TAX_RATE}
      OPEN_FOR_MIGRATION: ${OPEN_FOR_MIGRATION}
      PROTOCOL_VERSION: ${PROTOCOL_VERSION}
      RULE_VERSION: ${RULE_VERSION}
      FEDERATION_SHARED_SECRET: ${FEDERATION_SHARED_SECRET}
      CENTRAL_REGISTRY_URL: ${CENTRAL_REGISTRY_URL}
      CENTRAL_REGISTRY_TOKEN: ${CENTRAL_REGISTRY_TOKEN}
      CENTRAL_ROLES_POLICY_URL: ${CENTRAL_ROLES_POLICY_URL}
      CENTRAL_HEARTBEAT_URL: ${CENTRAL_HEARTBEAT_URL}
      CENTRAL_NODE_ID: ${CENTRAL_NODE_ID}
      CENTRAL_ROLES_POLICY_REQUIRED: ${CENTRAL_ROLES_POLICY_REQUIRED}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES}
      PASSWORD_RESET_CODE_TTL_MINUTES: ${PASSWORD_RESET_CODE_TTL_MINUTES:-15}
      # SMTP 全部給安全預設：舊 .env 缺這幾行也能啟動，只是忘記密碼會明確回報「郵件未設定」。
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SEC: ${SMTP_TIMEOUT_SEC:-10}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA}
      # 公開文件／史記／世界事件：全部有預設值，舊 .env 沒這幾行也能啟動。
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://app.ai-3kingdom.xyz}
      PUBLIC_DOC_BASE_URL: ${PUBLIC_DOC_BASE_URL:-}
      CHRONICLE_INCLUDE_DIALOGUE: ${CHRONICLE_INCLUDE_DIALOGUE:-false}
      CHRONICLE_LLM_ENDPOINT: ${CHRONICLE_LLM_ENDPOINT:-}
      CHRONICLE_LLM_API_KEY: ${CHRONICLE_LLM_API_KEY:-}
      CHRONICLE_LLM_MODEL: ${CHRONICLE_LLM_MODEL:-}
      WORLD_EVENTS_ENABLED: ${WORLD_EVENTS_ENABLED:-true}
      WORLD_EVENTS_DEADLINE_HOURS: ${WORLD_EVENTS_DEADLINE_HOURS:-72}
      WORLD_EVENTS_FAMINE_THRESHOLD: ${WORLD_EVENTS_FAMINE_THRESHOLD:-0}
      WORLD_EVENTS_FAMINE_RELIEF_TARGET: ${WORLD_EVENTS_FAMINE_RELIEF_TARGET:-500}
      WORLD_EVENTS_BETRAYAL_PENALTY: ${WORLD_EVENTS_BETRAYAL_PENALTY:-30}
      WORLD_EVENTS_FAMINE_WALL_PENALTY: ${WORLD_EVENTS_FAMINE_WALL_PENALTY:-50}
      # 每日 08:00 HKT 史記圖卡發文包；不填 webhook 也照常產圖與文案。
      CHRONICLE_CARD_ENABLED: ${CHRONICLE_CARD_ENABLED:-true}
      CHRONICLE_CARD_PUBLISH_HOUR_HKT: ${CHRONICLE_CARD_PUBLISH_HOUR_HKT:-8}
      CHRONICLE_CARD_API_PREFIX: ${CHRONICLE_CARD_API_PREFIX:-/api}
      CHRONICLE_CARD_WEBHOOK_URLS: ${CHRONICLE_CARD_WEBHOOK_URLS:-}
      CHRONICLE_CARD_WEBHOOK_TYPE: ${CHRONICLE_CARD_WEBHOOK_TYPE:-generic}
      ARENA_ENABLED: ${ARENA_ENABLED:-true}
      ARENA_HOUR_HKT: ${ARENA_HOUR_HKT:-7}
      # 十四日賽季：只讀排行榜與敘事層，不重置任何諸侯數值。
      SEASON_ENABLED: ${SEASON_ENABLED:-true}
      SEASON_LENGTH_DAYS: ${SEASON_LENGTH_DAYS:-14}
      # 觀眾席：免登入助威／押陣，只存 system_state，不改 agent 與賽季積分。
      AUDIENCE_ENABLED: ${AUDIENCE_ENABLED:-true}
      AUDIENCE_MAX_BOOST: ${AUDIENCE_MAX_BOOST:-0.12}
      AUDIENCE_MIN_VOTES: ${AUDIENCE_MIN_VOTES:-3}
      # 商城保底救濟：0 = 停用（預設），>0 = 每日重置後補到這個糧食底線。
      MARKET_RELIEF_FLOOR: ${MARKET_RELIEF_FLOOR:-0}
      # 饑荒自動止血：8 成以上諸侯付不起明日口糧才開倉一次，平時不干預商城經濟。
      MARKET_FAMINE_RELIEF_ENABLED: ${MARKET_FAMINE_RELIEF_ENABLED:-true}
      MARKET_FAMINE_RELIEF_FLOOR: ${MARKET_FAMINE_RELIEF_FLOOR:-60}
      MARKET_FAMINE_STARVING_RATIO: ${MARKET_FAMINE_STARVING_RATIO:-0.8}
      MARKET_FAMINE_MIN_AGENTS: ${MARKET_FAMINE_MIN_AGENTS:-3}
    depends_on:
      - postgres
      - redis

  city-worker:
    build:
      context: ../../backend
    container_name: ai3k-city-worker
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/ai3k
      JWT_SECRET: ${JWT_SECRET}
      CITY_NAME: ${CITY_NAME}
      CITY_BASE_URL: ${CITY_BASE_URL}
      CITY_LOCATION: ${CITY_LOCATION}
      WORLD_NAME: ${WORLD_NAME}
      CITY_WALL: ${CITY_WALL}
      CITY_TAX_RATE: ${CITY_TAX_RATE}
      OPEN_FOR_MIGRATION: ${OPEN_FOR_MIGRATION}
      PROTOCOL_VERSION: ${PROTOCOL_VERSION}
      RULE_VERSION: ${RULE_VERSION}
      FEDERATION_SHARED_SECRET: ${FEDERATION_SHARED_SECRET}
      CENTRAL_REGISTRY_URL: ${CENTRAL_REGISTRY_URL}
      CENTRAL_REGISTRY_TOKEN: ${CENTRAL_REGISTRY_TOKEN}
      CENTRAL_ROLES_POLICY_URL: ${CENTRAL_ROLES_POLICY_URL}
      CENTRAL_HEARTBEAT_URL: ${CENTRAL_HEARTBEAT_URL}
      CENTRAL_NODE_ID: ${CENTRAL_NODE_ID}
      CENTRAL_ROLES_POLICY_REQUIRED: ${CENTRAL_ROLES_POLICY_REQUIRED}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES}
      PASSWORD_RESET_CODE_TTL_MINUTES: ${PASSWORD_RESET_CODE_TTL_MINUTES:-15}
      # SMTP 全部給安全預設：舊 .env 缺這幾行也能啟動，只是忘記密碼會明確回報「郵件未設定」。
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SEC: ${SMTP_TIMEOUT_SEC:-10}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA}
      # 公開文件／史記／世界事件：全部有預設值，舊 .env 沒這幾行也能啟動。
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://app.ai-3kingdom.xyz}
      PUBLIC_DOC_BASE_URL: ${PUBLIC_DOC_BASE_URL:-}
      CHRONICLE_INCLUDE_DIALOGUE: ${CHRONICLE_INCLUDE_DIALOGUE:-false}
      CHRONICLE_LLM_ENDPOINT: ${CHRONICLE_LLM_ENDPOINT:-}
      CHRONICLE_LLM_API_KEY: ${CHRONICLE_LLM_API_KEY:-}
      CHRONICLE_LLM_MODEL: ${CHRONICLE_LLM_MODEL:-}
      WORLD_EVENTS_ENABLED: ${WORLD_EVENTS_ENABLED:-true}
      WORLD_EVENTS_DEADLINE_HOURS: ${WORLD_EVENTS_DEADLINE_HOURS:-72}
      WORLD_EVENTS_FAMINE_THRESHOLD: ${WORLD_EVENTS_FAMINE_THRESHOLD:-0}
      WORLD_EVENTS_FAMINE_RELIEF_TARGET: ${WORLD_EVENTS_FAMINE_RELIEF_TARGET:-500}
      WORLD_EVENTS_BETRAYAL_PENALTY: ${WORLD_EVENTS_BETRAYAL_PENALTY:-30}
      WORLD_EVENTS_FAMINE_WALL_PENALTY: ${WORLD_EVENTS_FAMINE_WALL_PENALTY:-50}
      # 每日 08:00 HKT 史記圖卡發文包；不填 webhook 也照常產圖與文案。
      CHRONICLE_CARD_ENABLED: ${CHRONICLE_CARD_ENABLED:-true}
      CHRONICLE_CARD_PUBLISH_HOUR_HKT: ${CHRONICLE_CARD_PUBLISH_HOUR_HKT:-8}
      CHRONICLE_CARD_API_PREFIX: ${CHRONICLE_CARD_API_PREFIX:-/api}
      CHRONICLE_CARD_WEBHOOK_URLS: ${CHRONICLE_CARD_WEBHOOK_URLS:-}
      CHRONICLE_CARD_WEBHOOK_TYPE: ${CHRONICLE_CARD_WEBHOOK_TYPE:-generic}
      ARENA_ENABLED: ${ARENA_ENABLED:-true}
      ARENA_HOUR_HKT: ${ARENA_HOUR_HKT:-7}
      # 十四日賽季：只讀排行榜與敘事層，不重置任何諸侯數值。
      SEASON_ENABLED: ${SEASON_ENABLED:-true}
      SEASON_LENGTH_DAYS: ${SEASON_LENGTH_DAYS:-14}
      # 觀眾席：免登入助威／押陣，只存 system_state，不改 agent 與賽季積分。
      AUDIENCE_ENABLED: ${AUDIENCE_ENABLED:-true}
      AUDIENCE_MAX_BOOST: ${AUDIENCE_MAX_BOOST:-0.12}
      AUDIENCE_MIN_VOTES: ${AUDIENCE_MIN_VOTES:-3}
      # 商城保底救濟：0 = 停用（預設），>0 = 每日重置後補到這個糧食底線。
      MARKET_RELIEF_FLOOR: ${MARKET_RELIEF_FLOOR:-0}
      # 饑荒自動止血：8 成以上諸侯付不起明日口糧才開倉一次，平時不干預商城經濟。
      MARKET_FAMINE_RELIEF_ENABLED: ${MARKET_FAMINE_RELIEF_ENABLED:-true}
      MARKET_FAMINE_RELIEF_FLOOR: ${MARKET_FAMINE_RELIEF_FLOOR:-60}
      MARKET_FAMINE_STARVING_RATIO: ${MARKET_FAMINE_STARVING_RATIO:-0.8}
      MARKET_FAMINE_MIN_AGENTS: ${MARKET_FAMINE_MIN_AGENTS:-3}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_RELEASE_VERSION: -e
    container_name: ai3k-frontend
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1g
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_RELEASE_VERSION: -e
    depends_on:
      - city-api

  gateway:
    image: nginx:1.25-alpine
    container_name: ai3k-gateway
    depends_on:
      - frontend
      - city-api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-10090}:80"

  postgres:
    image: postgres:16
    container_name: ai3k-postgres
    environment:
      POSTGRES_DB: ai3k
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai3k-redis

volumes:
  postgres-data:
