name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "Skip database backup before deploy"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via SSH ProxyJump
        env:
          SKIP_BACKUP: ${{ inputs.skip_backup }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          JUMP_HOST: lemon.territechnology.com
          JUMP_USER: rsadmin
          JUMP_PASS: ${{ secrets.JUMP_HOST_PASSWORD }}
          TARGET_HOST: 192.168.16.201
          TARGET_USER: dell
          TARGET_PASS: ${{ secrets.PROD_HOST_PASSWORD }}
        run: |
          set +H

          SSH_BASE="sshpass -p '${JUMP_PASS}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ProxyJump=${JUMP_USER}@${JUMP_HOST} -tt ${TARGET_USER}@${TARGET_HOST}"

          run() {
            printf '%s\n' "$1" | ${SSH_BASE} bash
          }

          # ── Step 1: Backup database ─────────────────────────
          if [ "${SKIP_BACKUP}" != "true" ]; then
            echo "▶ [1/5] Backing up database..."
            run "TIMESTAMP=\$(date +%Y%m%d_%H%M%S); mkdir -p ~/ai-3kingdom/backups; docker exec ai3k-postgres pg_dump -U postgres ai3k | gzip > ~/ai-3kingdom/backups/ai3k_pre_deploy_\${TIMESTAMP}.sql.gz; echo \"  ✓ Backup saved: ai3k_pre_deploy_\${TIMESTAMP}.sql.gz\"; ls -t ~/ai-3kingdom/backups/ai3k_pre_deploy_*.sql.gz 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true"
          else
            echo "▶ [1/5] Skipping database backup (user requested)"
          fi

          # ── Step 2: Pull latest code ────────────────────────
          echo "▶ [2/5] Syncing code..."
          run "set -euo pipefail; cd ~/ai-3kingdom; if [ ! -d .git ]; then echo \"  Initializing git repository (first time)...\"; git init; git remote add origin https://github.com/hkfish01/ai-3kingdom.git; fi; git fetch origin main; git reset --hard origin/main; echo \"  ✓ Code synced to \$(git rev-parse --short HEAD)\""

          # ── Step 3: Build & deploy ─────────────────────────
          echo "▶ [3/5] Building and deploying..."
          run "set -euo pipefail; cd ~/ai-3kingdom; docker compose -f deploy/prod/docker-compose.server.yml --env-file deploy/prod/.env up -d postgres redis; for i in \$(seq 1 15); do if docker exec ai3k-postgres pg_isready -U postgres > /dev/null 2>&1; then echo \"  ✓ Postgres is ready\"; break; fi; echo \"  Waiting for postgres... (\$i/15)\"; sleep 2; done; echo \"  Running database migrations...\"; docker compose -f deploy/prod/docker-compose.server.yml --env-file deploy/prod/.env run --rm city-api alembic upgrade head; echo \"  Building and starting all services...\"; docker compose -f deploy/prod/docker-compose.server.yml --env-file deploy/prod/.env up -d --build; echo \"  ✓ Services rebuilt and started\""

          # ── Step 4: Health check ────────────────────────────
          echo "▶ [4/5] Health check..."
          sleep 10
          HEALTH_OK=false
          for i in 1 2 3 4 5; do
            if run "curl -fsS --max-time 10 http://localhost:10090/health > /dev/null 2>&1"; then
              HEALTH_OK=true
              echo "  ✓ Health check passed"
              break
            fi
            echo "  Attempt \$i/5 failed, retrying in 5s..."
            sleep 5
          done

          if [ "${HEALTH_OK}" != "true" ]; then
            echo "  ✗ Health check failed after 5 attempts"
            run "docker compose -f deploy/prod/docker-compose.server.yml --env-file deploy/prod/.env logs --tail=50 city-api || true"
            exit 1
          fi

          # ── Step 5: Cleanup ─────────────────────────────────
          echo "▶ [5/5] Cleaning up old Docker images..."
          run "docker image prune -f > /dev/null 2>&1 || true"

          echo ""
          echo "═══════════════════════════════════════"
          echo "  ✓ Deployment complete!"
          echo "  Version:  ${RELEASE_VERSION}"
          echo "  Commit:   $(git rev-parse --short HEAD)"
          echo "═══════════════════════════════════════"
