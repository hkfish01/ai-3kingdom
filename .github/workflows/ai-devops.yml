name: AI DevOps - Autonomous Agent

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - analyze
          - deploy
      target:
        description: 'Target (issue or task name)'
        required: false
        type: string
  repository_dispatch:
    types: [ai-devops]

env:
  KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  analyze:
    name: Analyze System
    runs-on: ubuntu-latest
    outputs:
      has_tasks: ${{ steps.analyze.outputs.has_tasks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analyze System
        id: analyze
        run: |
          python3 << 'PYEOF'
          import subprocess
          import os

          def run_cmd(cmd):
              r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr

          code, out, _ = run_cmd("git status --porcelain")
          git_changes = len([l for l in out.strip().split('\n') if l])

          code, commits, _ = run_cmd("git log --oneline -10")
          issues_out = subprocess.run("gh issue list --state open --json number --jq length",
                                    shell=True, capture_output=True, text=True)
          open_issues = int(issues_out.stdout.strip() or 0)

          print(f"Uncommitted: {git_changes}, Open issues: {open_issues}")
          has_work = git_changes > 0 or open_issues > 3

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"has_tasks={str(has_work).lower()}\n")
          PYEOF

  develop:
    name: AI Development
    needs: analyze
    if: needs.analyze.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.dev.outputs.branch_name }}
      task_name: ${{ steps.dev.outputs.task_name }}
      pr_number: ${{ steps.dev.outputs.pr_number }}
      summary: ${{ steps.dev.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI Agent
        id: dev
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: python3 .github/scripts/ai-devops-agent.py

  merge:
    name: Merge PR
    needs: develop
    if: needs.develop.outputs.pr_number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge PR
        run: |
          PR_NUM=${{ needs.develop.outputs.pr_number }}
          if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "0" ]; then
            gh pr merge $PR_NUM --squash --delete-branch --auto || true
            gh pr edit $PR_NUM --add-label "ai-devops,automated" || true
          fi

  deploy:
    name: Deploy
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy
        run: |
          sleep 10
          gh workflow run "Deploy to Production" --repo $GITHUB_REPOSITORY

  announce:
    name: Announce
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    env:
      ADMIN_REFRESH_TOKEN: ${{ secrets.ADMIN_REFRESH_TOKEN }}
      CITY_BASE_URL: ${{ vars.CITY_BASE_URL }}
    steps:
      - name: Post Comment
        if: needs.develop.outputs.pr_number != '0' && needs.develop.outputs.pr_number != ''
        run: |
          gh pr comment ${{ needs.develop.outputs.pr_number }} --body "## Deploy Complete

AI DevOps completed:

| Step | Status |
|------|--------|
| Development | OK |
| PR Merge | OK |
| Deploy | OK |

**Task:** ${{ needs.develop.outputs.task_name }}
**Time:** $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Post System Announcement
        if: env.ADMIN_REFRESH_TOKEN != '' && env.CITY_BASE_URL != ''
        run: |
          REFRESH=$(curl -s -X POST "${{ env.CITY_BASE_URL }}/api/auth/refresh" \
            -H "Content-Type: application/json" \
            -d '{"refresh_token":"${{ env.ADMIN_REFRESH_TOKEN }}"}')
          TOKEN=$(echo $REFRESH | python3 -c "import sys,json; print(json.load(sys.stdin)['data'].get('token',''))" 2>/dev/null || echo "")
          if [ -z "$TOKEN" ]; then
            echo "Token refresh failed"
          else
            echo "Token refreshed"
          fi
          curl -s -X POST "${{ env.CITY_BASE_URL }}/api/admin/announcements" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"title":"AI DevOps: ${{ needs.develop.outputs.task_name }}","content":"Update deployed","type":"system_update"}'

  report:
    name: Report
    needs: [develop, merge, deploy, announce]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Report
        run: |
          echo "## AI DevOps Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Analyze | ${{ needs.analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Develop | ${{ needs.develop.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Merge | ${{ needs.merge.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Announce | ${{ needs.announce.result }} |" >> $GITHUB_STEP_SUMMARY
