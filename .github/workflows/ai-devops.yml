name: AI DevOps

on:
  schedule:
    - cron: '0 1 * * *'  # HKT 09:00
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'review'
        type: choice
        options:
          - review
          - generate
  repository_dispatch:
    types: [ai-devops]

env:
  KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    outputs:
      approve: ${{ steps.decision.outputs.approve }}
      approved_pr_number: ${{ steps.decision.outputs.approved_pr_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Review AI DevOps PRs
        id: decision
        env:
          GITHUB_OUTPUT: ${{ github.output }}
          GITHUB_ENV: ${{ github.env }}
        run: python3 .github/scripts/ai-devops-agent.py --mode review

  deploy:
    name: Deploy
    needs: review
    if: ${{ needs.review.outputs.approve == 'true' && needs.review.outputs.approved_pr_number != '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge approved PR
        env:
          PR_NUMBER: ${{ needs.review.outputs.approved_pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch

      - name: Trigger deployment
        run: |
          sleep 10
          gh workflow run "Deploy to Production" --repo "$GITHUB_REPOSITORY"
