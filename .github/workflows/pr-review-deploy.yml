name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  # ============ 代碼審查 ============
  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Cursor Review
        run: |
          python3 scripts/ai-devops/cursor_reviewer.py --pr ${{ github.event.pull_request.number }}

  # ============ PR 狀態更新 ============
  update-pr-status:
    name: Update PR Status
    needs: code-review
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Update PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviewResult = needs.code-review.result === 'success' ? '✅ 代碼審查完成' : '⚠️ 代碼審查失敗';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `## PR 審批狀態\n\n${reviewResult}\n\n**Commit:** \`${{ github.sha }}\`\n**Branch:** \`${{ github.head_ref }}\`\n\n請在服務器上更新 .env 文件，然後執行部署。`
            });
