name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: false
        default: 'full'
        type: choice
        options:
          - full      # 完整流程：分析、開發、部署、公告
          - analyze   # 只分析不執行
          - deploy    # 只觸發部署

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Run migrations
        run: |
          source .venv/bin/activate
          cd backend
          PYTHONPATH=. alembic upgrade head

      - name: Run tests
        run: |
          source .venv/bin/activate
          cd backend
          PYTHONPATH=. pytest -q

      - name: Run health check tests
        run: |
          source .venv/bin/activate
          cd backend
          PYTHONPATH=. pytest -q tests/test_health.py

      - name: Export OpenAPI
        run: |
          source .venv/bin/activate
          cd backend
          PYTHONPATH=. python scripts/export_openapi.py
          PYTHONPATH=. python scripts/export_error_codes.py

      - name: Validate OpenAPI core paths
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import json
          from pathlib import Path

          spec = json.loads(Path("backend/openapi.json").read_text(encoding="utf-8"))
          required = [
              "/auth/login",
              "/agent/register",
              "/world/manifest",
              "/federation/v1/hello",
              "/federation/v1/attack",
          ]
          missing = [p for p in required if p not in spec.get("paths", {})]
          if missing:
              raise SystemExit(f"Missing OpenAPI paths: {missing}")
          print("OpenAPI validation passed")
          PY

      - name: Validate error code document
        run: |
          source .venv/bin/activate
          python - <<'PY'
          from pathlib import Path
          text = Path("backend/error-codes.md").read_text(encoding="utf-8")
          required = ["`UNAUTHORIZED`", "`FEDERATION_REPLAY`", "`INTERNAL_ERROR`"]
          missing = [code for code in required if code not in text]
          if missing:
              raise SystemExit(f"Missing error code docs entries: {missing}")
          print("Error code document validation passed")
          PY

      - name: Validate nginx config syntax
        run: |
          docker run --rm \
            -v "$PWD/deploy/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.25-alpine nginx -t

  # 每次優化都要留下一則人 + agent 共讀的公告，否則 revision 不變、系統不會發文。
  release-notes:
    name: release notes / announcement contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release bump and dual-audience fields
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # 同一個 feature 分支的第二個以後 commit：前一 commit 已寫過這版公告。
            FLAGS="--allow-same-version"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            echo "Base $BASE unavailable; running field checks only."
            BASE=""
          fi
          if [ -n "$BASE" ]; then
            python backend/scripts/check_release_notes.py --base "$BASE" $FLAGS
          else
            python backend/scripts/check_release_notes.py $FLAGS
          fi
