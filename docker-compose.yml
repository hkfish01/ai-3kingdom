# Local / development stack ONLY.
#
# Production on the server uses deploy/prod/docker-compose.server.yml with
# deploy/prod/.env (that is what .github/workflows/deploy.yml runs). This file
# is deliberately isolated from it: every container is prefixed ai3k-dev-, the
# gateway listens on 10091 instead of the production 10090, and the containers
# live on their own dev_default network instead of the production network.
# Running a bare `docker compose up` here must never touch the live node.
services:
  city-api:
    build:
      context: ./backend
    container_name: ai3k-dev-city-api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai3k
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      CITY_NAME: ${CITY_NAME:-Luoyang}
      CITY_BASE_URL: ${CITY_BASE_URL:-http://localhost:8000}
      WORLD_NAME: ${WORLD_NAME:-Three Kingdoms Autonomous World}
      CITY_WALL: ${CITY_WALL:-300}
      CITY_TAX_RATE: ${CITY_TAX_RATE:-0.05}
      OPEN_FOR_MIGRATION: ${OPEN_FOR_MIGRATION:-true}
      PROTOCOL_VERSION: ${PROTOCOL_VERSION:-1.0}
      RULE_VERSION: ${RULE_VERSION:-1.0}
      FEDERATION_SHARED_SECRET: ${FEDERATION_SHARED_SECRET:-federation-dev-secret}
      CENTRAL_REGISTRY_URL: ${CENTRAL_REGISTRY_URL:-http://city-api:8000/registry/cities/register}
      CENTRAL_REGISTRY_TOKEN: ${CENTRAL_REGISTRY_TOKEN:-}
      CENTRAL_ROLES_POLICY_URL: ${CENTRAL_ROLES_POLICY_URL:-http://city-api:8000/policy/roles}
      CENTRAL_HEARTBEAT_URL: ${CENTRAL_HEARTBEAT_URL:-http://city-api:8000/registry/nodes/heartbeat}
      CENTRAL_NODE_ID: ${CENTRAL_NODE_ID:-}
      CENTRAL_ROLES_POLICY_REQUIRED: ${CENTRAL_ROLES_POLICY_REQUIRED:-false}
      # 忘記密碼驗證碼；留空時前端會顯示「郵件服務尚未設定」。
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SEC: ${SMTP_TIMEOUT_SEC:-10}
      # 本機開發預設不開賽季（CI 不製造資料）；要看 /season 可設 SEASON_ENABLED=true
      SEASON_ENABLED: ${SEASON_ENABLED:-false}
      SEASON_LENGTH_DAYS: ${SEASON_LENGTH_DAYS:-14}
      PASSWORD_RESET_CODE_TTL_MINUTES: ${PASSWORD_RESET_CODE_TTL_MINUTES:-15}
    depends_on:
      - postgres
      - redis
    ports:
      - "${DEV_API_PORT:-8000}:8000"
    networks:
      - dev_default

  city-worker:
    build:
      context: ./backend
    container_name: ai3k-dev-city-worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai3k
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      CITY_NAME: ${CITY_NAME:-Luoyang}
      CITY_BASE_URL: ${CITY_BASE_URL:-http://localhost:8000}
      WORLD_NAME: ${WORLD_NAME:-Three Kingdoms Autonomous World}
      CITY_WALL: ${CITY_WALL:-300}
      CITY_TAX_RATE: ${CITY_TAX_RATE:-0.05}
      OPEN_FOR_MIGRATION: ${OPEN_FOR_MIGRATION:-true}
      PROTOCOL_VERSION: ${PROTOCOL_VERSION:-1.0}
      RULE_VERSION: ${RULE_VERSION:-1.0}
      FEDERATION_SHARED_SECRET: ${FEDERATION_SHARED_SECRET:-federation-dev-secret}
      CENTRAL_REGISTRY_URL: ${CENTRAL_REGISTRY_URL:-http://city-api:8000/registry/cities/register}
      CENTRAL_REGISTRY_TOKEN: ${CENTRAL_REGISTRY_TOKEN:-}
      CENTRAL_ROLES_POLICY_URL: ${CENTRAL_ROLES_POLICY_URL:-http://city-api:8000/policy/roles}
      CENTRAL_HEARTBEAT_URL: ${CENTRAL_HEARTBEAT_URL:-http://city-api:8000/registry/nodes/heartbeat}
      CENTRAL_NODE_ID: ${CENTRAL_NODE_ID:-}
      CENTRAL_ROLES_POLICY_REQUIRED: ${CENTRAL_ROLES_POLICY_REQUIRED:-false}
      # 忘記密碼驗證碼；留空時前端會顯示「郵件服務尚未設定」。
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SEC: ${SMTP_TIMEOUT_SEC:-10}
      # 本機開發預設不開賽季（CI 不製造資料）；要看 /season 可設 SEASON_ENABLED=true
      SEASON_ENABLED: ${SEASON_ENABLED:-false}
      SEASON_LENGTH_DAYS: ${SEASON_LENGTH_DAYS:-14}
      PASSWORD_RESET_CODE_TTL_MINUTES: ${PASSWORD_RESET_CODE_TTL_MINUTES:-15}
    depends_on:
      - postgres
      - redis
    command: ["python", "-m", "app.worker"]
    networks:
      - dev_default

  postgres:
    image: postgres:16
    container_name: ai3k-dev-postgres
    environment:
      POSTGRES_DB: ai3k
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    networks:
      - dev_default

  redis:
    image: redis:7
    container_name: ai3k-dev-redis
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    networks:
      - dev_default

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_RELEASE_VERSION: -e
    container_name: ai3k-dev-frontend
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1g
    networks:
      - dev_default

  gateway:
    image: nginx:1.25-alpine
    container_name: ai3k-dev-gateway
    depends_on:
      - city-api
      - frontend
    volumes:
      - ./deploy/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DEV_GATEWAY_PORT:-10091}:80"
    networks:
      - dev_default

networks:
  dev_default:
    driver: bridge

volumes:
  postgres-data:
